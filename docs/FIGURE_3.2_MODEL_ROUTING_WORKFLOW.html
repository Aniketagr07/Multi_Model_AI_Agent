    <rect x="0" y="0" width="1100" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="25" y="28" font-size="12" font-weight="800" fill="#0F172A">TECHNICAL SPECIFICATION &amp; ACADEMIC JUSTIFICATION:</text>

    <text x="25" y="52" font-size="11" font-weight="700" fill="#1D4ED8">1. Rule-Based Determinism:</text>
    <text x="185" y="52" font-size="11" font-weight="400" fill="#475569">The router employs regular expressions and keyword pattern weights rather than a meta-LLM call,</text>
    <text x="25" y="68" font-size="11" font-weight="400" fill="#475569">guaranteeing sub-millisecond execution (< 1ms) and completely eliminating extra inference costs and circular latency.</text>

    <text x="25" y="92" font-size="11" font-weight="700" fill="#7C3AED">2. No "Objectively Best" Claim:</text>
    <text x="200" y="92" font-size="11" font-weight="400" fill="#475569">The mechanism maps prompts based on empirical task suitability (e.g. Groq for rapid code synthesis,</text>
    <text x="25" y="108" font-size="11" font-weight="400" fill="#475569">Gemini for deep context &amp; multimodal logic). It provides explainable heuristic routing, not a mathematical optimality guarantee.</text>

    <text x="25" y="132" font-size="11" font-weight="700" fill="#059669">3. Guaranteed Fallback:</text>
    <text x="160" y="132" font-size="11" font-weight="400" fill="#475569">When a query does not trigger specialized syntax patterns or when preferred providers experience 429 quota limits,</text>
    <text x="25" y="146" font-size="11" font-weight="400" fill="#475569">the pipeline deterministically cascades to the configured general-purpose default model without failing the user request.</text>
